version: "3.8"

networks:
  redis-net:
    driver: bridge

services:
  redis-node-1:
    image: redis:7-alpine
    container_name: redis-node-1
    command: >
      redis-server
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --port 6379
      --bind 0.0.0.0
    ports:
      - "7001:6379"
    networks:
      - redis-net
    volumes:
      - redis-1-data:/data

  redis-node-2:
